spring.application.name=mecanica-execution-service
server.port=${SERVER_PORT:8083}
server.address=${SERVER_ADDRESS:127.0.0.1}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5435/mecanica_execution}
spring.datasource.username=${DATABASE_USERNAME:mecanica_execution}
spring.datasource.password=${DATABASE_PASSWORD:execution_local}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Disabled for standalone local use. Enable in the integrated Compose environment.
integration.messaging.enabled=${MESSAGING_ENABLED:false}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5673}
spring.rabbitmq.username=${RABBITMQ_USERNAME:mecanica_local}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:mecanica_local_password}
spring.rabbitmq.connection-timeout=5s
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
management.health.rabbit.enabled=${MESSAGING_ENABLED:false}

spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=2
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=5s
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.prefetch=1

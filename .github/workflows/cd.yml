name: execution CD
on:
  workflow_run:
    workflows: ['Execution CI']
    branches: [main]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: execution-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    environment: fase4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_REGION: us-east-1
      EKS_CLUSTER: mecanica-fase4
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
      SERVICE: mecanica-execution-service
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Reject superseded main commit
        run: |
          set -euo pipefail
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$latest" != "$IMAGE_TAG" ]; then
            echo 'A newer commit exists on main. Deploy its successful CI run instead.'
            exit 1
          fi
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Publish immutable commit image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]
          existing=$(aws ecr list-images --repository-name "$SERVICE" --filter tagStatus=TAGGED --query "imageIds[?imageTag=='${IMAGE_TAG}'].imageTag" --output text)
          if [ -z "$existing" ]; then
            docker build -t "$REGISTRY/$SERVICE:$IMAGE_TAG" .
            docker push "$REGISTRY/$SERVICE:$IMAGE_TAG"
          fi
      - name: Deploy verified image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          # Match kubectl to the pinned EKS version, checking the published checksum.
          curl --fail --location --silent --show-error -o kubectl https://dl.k8s.io/release/v1.36.0/bin/linux/amd64/kubectl
          curl --fail --location --silent --show-error -o kubectl.sha256 https://dl.k8s.io/release/v1.36.0/bin/linux/amd64/kubectl.sha256
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          chmod +x kubectl
          aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"
          ./kubectl -n mecanica-fase4 get secret "$SERVICE-secret" >/dev/null
          ./kubectl kustomize k8s | sed "s|image: $SERVICE:release|image: $REGISTRY/$SERVICE:$IMAGE_TAG|" > /tmp/deploy.yaml
          if grep -q ':release' /tmp/deploy.yaml; then echo 'Unresolved image placeholder'; exit 1; fi
          ./kubectl apply -f /tmp/deploy.yaml
          ./kubectl -n mecanica-fase4 rollout status "deployment/$SERVICE" --timeout=10m

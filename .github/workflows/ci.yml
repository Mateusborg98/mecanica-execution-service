name: Execution CI
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mecanica_execution
          POSTGRES_USER: mecanica_execution
          POSTGRES_PASSWORD: execution_local
        ports: ['5435:5432']
        options: >-
          --health-cmd "pg_isready -U mecanica_execution -d mecanica_execution"
          --health-interval 5s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw -B -f tools/dlq/pom.xml clean verify
      - run: ./mvnw -B clean verify
      - run: ./mvnw -B verify
        env:
          RUN_POSTGRES_TESTS: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: execution-test-reports
          path: |
            target/surefire-reports
            target/site/jacoco
            target/pmd.xml
            target/reports/pmd.html
            target/cucumber
            tools/dlq/target/surefire-reports
            tools/dlq/target/pmd.xml
            tools/dlq/target/reports/pmd.html
      - run: docker build -t mecanica-execution-service:ci .

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Kubernetes manifests
        run: |
          set -euo pipefail
          kubectl kustomize k8s > /tmp/app.yaml
          docker run --rm -i ghcr.io/yannh/kubeconform:v0.7.0 -strict -summary -kubernetes-version 1.36.0 < /tmp/app.yaml
